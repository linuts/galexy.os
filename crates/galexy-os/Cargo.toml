[package]
name = "galexy-os"
version = "0.1.0"
edition = "2021"

[features]
default = ["pc-speaker"]
# Idle-steal tracing. Off in production images; the one-line reap count
# stays in every build because the suite treats it as lifecycle evidence.
verbose-sched = []
# PC speaker (PIT channel 2). The only audio path and the only PIT user
# after boot. On by default; there is no virtio-sound.
pc-speaker = []

[dependencies]
bootloader_api = "0.11"
galexy-abi = { path = "../galexy-abi" }
galexy-core = { path = "../galexy-core" }
galexy-crypto = { path = "../galexy-crypto" }
galexy-galf = { path = "../galexy-galf" }
x86_64 = "0.15"
spin = "0.12"
uart_16550 = "0.8"
noto-sans-mono-bitmap = "0.3"
pic8259 = "0.11"
pc-keyboard = "0.9"
linked_list_allocator = "0.10"
xmas-elf = "0.10"

[[bin]]
name = "galexy-os"
path = "src/main.rs"
