[package]
name = "runner"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
galexy-galf = { path = "../galexy-galf" }

[build-dependencies]
bootloader = "0.11"
tar = "0.4"
galexy-crypto = { path = "../galexy-crypto" }
gxc = { path = "../gxc" }
galexy-os = { path = "../galexy-os", artifact = "bin", target = "x86_64-unknown-none" }
# Userspace is not an artifact dependency. It builds for the JSON target
# `targets/x86_64-unknown-galexy.json` with `-Zbuild-std`, which a
# workspace `cargo build` cannot apply to one artifact without also
# rebuilding `core` for the host. `build.rs` runs that cargo itself.
