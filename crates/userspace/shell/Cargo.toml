[package]
name = "shell"
version = "0.1.0"
edition = "2021"
description = "The galexy.os interactive shell, as a ring-3 program."

[[bin]]
name = "shell"
path = "src/main.rs"

[features]
# Supervisor e2e only. Release ramdisk images leave this off so `crash`
# is not a command. See runner `galexy-os-crashseam`.
crash-seam = []

[dependencies]
galexy-rt = { path = "../galexy-rt" }
galexy-abi = { path = "../../galexy-abi" }

[build-dependencies]
galexy-abi = { path = "../../galexy-abi" }
