[package]
name = "galexy-rt"
version = "0.1.0"
edition = "2021"
description = "The ring-3 runtime: syscall wrappers, program entry, panic handler. The bottom of every user program's dependency stack (galexy-rt -> galexy-abi; never the kernel)."

[lib]
name = "galexy_rt"
path = "src/lib.rs"

[dependencies]
galexy-abi = { path = "../../galexy-abi" }

[features]
# A `std` + `panic_abort` program (Milestone 68) links this crate for
# the allocator and the syscall wrappers. `panic_abort` owns the panic
# handler, so this feature leaves that lang item out. Built in its own
# cargo invocation: enabling it beside a `no_std` program would strip
# the handler those programs need.
std = []
