[package]
name = "galexy-rt"
version = "0.1.0"
edition = "2021"
description = "The ring-3 runtime: syscall wrappers, program entry, panic handler. The bottom of every user program's dependency stack (galexy-rt -> galexy-abi; never the kernel)."

[lib]
name = "galexy_rt"
path = "src/lib.rs"

[dependencies]
galexy-abi = { path = "../../galexy-abi" }

[features]
# A `std` program (Milestone 68/70) links this crate for the syscall
# wrappers only. `panic_abort` owns the panic handler and the PAL's
# `System` owns the heap, so this feature leaves both lang items out.
# Built in its own cargo invocation: enabling it beside a `no_std`
# program would strip the handler and allocator those programs need.
std = []
