[package]
name = "galexy-ssh"
version = "0.1.0"
edition = "2021"
description = "SSH and SFTP for milestone 117. One current algorithm set, no legacy fallback."

[dependencies]
chacha20 = { version = "0.10", features = ["legacy"] }
cipher = "0.5"
ed25519-dalek = "3"
getrandom = "0.4"
poly1305 = "0.9"
sha2 = "0.11"
subtle = { version = "2", default-features = false }
x25519-dalek = { version = "3", default-features = false, features = ["static_secrets"] }
zeroize = { version = "1", default-features = false }
