name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Pure-Rust evidence: host suites, clippy on every crate, rustfmt.
  # No QEMU, no kernel image build — finishes in a few minutes.
  host:
    name: host tests, clippy, fmt
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add clippy rustfmt
          rustup show active-toolchain
          rustc -V && cargo -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: host

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: Host test suites
        run: >
          cargo test
          -p galexy-abi -p galexy-core -p galexy-crypto -p galexy-galf
          -p galfs-fsck -p gxc -p gxld

      - name: Clippy (host crates, all targets)
        run: >
          cargo clippy
          -p galexy-abi -p galexy-core -p galexy-crypto -p galexy-galf
          -p galfs-fsck -p gxc -p gxld
          --all-targets -- -D warnings

      - name: Clippy (kernel bins, x86_64-unknown-none)
        run: >
          cargo clippy -p galexy-os
          --target x86_64-unknown-none --no-deps --bins -- -D warnings

      - name: Clippy (userspace programs, x86_64-unknown-none)
        run: >
          cargo clippy -p galexy-rt -p hello -p init -p shell -p util
          --target x86_64-unknown-none --no-deps -- -D warnings

  # Boots every test kernel under QEMU (BIOS and UEFI, -smp 2).
  # Release profile (debug assertions still on). Accel is kvm when
  # /dev/kvm is writable, otherwise tcg; the log line is `[runner] accel=`.
  # `--test-threads=1`: galfs disk and QMP typing cases share host
  # files and keyboard timing, so they do not run in parallel.
  qemu:
    name: QEMU boot suite
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OVMF_FD: /usr/share/ovmf/OVMF.fd
    steps:
      - uses: actions/checkout@v4

      - name: Install QEMU and OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          qemu-system-x86_64 --version
          test -f "$OVMF_FD"

      - name: Install pinned toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup component add clippy
          rustup show active-toolchain
          rustc -V

      - uses: Swatinem/rust-cache@v2
        with:
          key: qemu

      - name: Build images (release profile, same as the tests)
        run: cargo build -p runner --release

      - name: Clippy (runner incl. boot tests)
        run: cargo clippy -p runner --all-targets -- -D warnings

      - name: Audit strings (no secrets in serial output)
        run: cargo test -p runner --test audit_strings --release

      - name: Boot suite
        run: cargo test -p runner --test boot --release -- --test-threads=1

      - name: Upload serial logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-logs
          path: /tmp/galexy-serial-*.log
          if-no-files-found: ignore
