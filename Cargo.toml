[workspace]
resolver = "2"
members = [
    "crates/runner",
    "crates/galexy-os",
    "crates/galexy-core",
    "crates/galexy-crypto",
    "crates/galexy-abi",
    "crates/galexy-galf",
    "crates/galfs-fsck",
    "crates/userspace/galexy-rt",
    "crates/userspace/hello",
    "crates/userspace/init",
    "crates/userspace/shell",
    "crates/userspace/util",
    "crates/gxc",
    "crates/gxld",
]
default-members = ["crates/runner"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

# bootloader 0.11.17, pointed at a stage-4 with a 64 KiB stack so
# `mappings.aslr` can seed its RNG. The stock BIOS stack (SP = 0x7c00)
# overflows in `Hc128Core::from_seed`.
[patch.crates-io]
bootloader = { path = "third_party/bootloader" }
